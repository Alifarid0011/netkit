name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y tcpdump nftables iproute2
      - run: go test -race ./...
      - run: go vet ./...
      - name: Verify isolated firewall integration
        run: |
          go test -c -o "$RUNNER_TEMP/netkit-linux.test" ./internal/linux
          sudo env NETKIT_TEST_NFT=1 "$RUNNER_TEMP/netkit-linux.test" -test.run '^TestFirewallIsolation$' -test.v
      - run: bash packaging/build.sh "$GITHUB_REF_NAME"
      - name: Publish archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "Netkit $GITHUB_REF_NAME" --notes-file CHANGELOG.md
